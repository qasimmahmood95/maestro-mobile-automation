# Core shopping journey: catalog → product detail → cart → checkout →
# order placed. Launches with stopApp: false so that, when the suite runs in
# order, the in-memory login from 10-login-success is still alive — and
# self-heals via ensure-logged-in so it also passes standalone from a cold
# start.
appId: com.saucelabs.mydemoapp.android
name: 20-checkout-journey
tags:
  - journey
---
- launchApp:
    stopApp: false
- runFlow: ../subflows/ensure-logged-in.yaml
- runFlow: ../subflows/add-first-product-to-cart.yaml
# Header cart icon → cart review.
- tapOn:
    id: ".*cartRL"
- assertVisible:
    text: "(?i)my cart"
- tapOn:
    id: ".*cartBt"
# Shipping address (already logged in, so checkout goes straight here).
- assertVisible:
    id: ".*fullNameET"
- tapOn:
    id: ".*fullNameET"
- inputText: "Rebecca Winter"
- tapOn:
    id: ".*address1ET"
- inputText: "Mandorley 112"
- tapOn:
    id: ".*cityET"
- inputText: "Truro"
- tapOn:
    id: ".*zipET"
- inputText: "89750"
- tapOn:
    id: ".*countryET"
- inputText: "United Kingdom"
- hideKeyboard
- tapOn:
    id: ".*paymentBtn"
# Payment details.
- assertVisible:
    id: ".*cardNumberET"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/nameET"
- inputText: "Rebecca Winter"
- tapOn:
    id: ".*cardNumberET"
- inputText: "3258125675687891"
- tapOn:
    id: ".*expirationDateET"
- inputText: "0330"
- tapOn:
    id: ".*securityCodeET"
- inputText: "123"
- hideKeyboard
- tapOn:
    id: ".*paymentBtn"
# Review order → place it.
- assertVisible:
    text: "(?i)review your order"
- tapOn:
    id: ".*paymentBtn"
# Confirmation.
- assertVisible:
    text: "(?i)checkout complete"
- assertVisible:
    text: "(?i)thank you for your order.*"
# Back to shopping — leaves the app on the catalog, still logged in.
- tapOn:
    id: ".*shoopingBt"
- assertVisible:
    id: ".*productRV"
