# Core shopping journey: catalog → product detail → cart → checkout →
# order placed. Launches with stopApp: false so that, when the suite runs in
# order, the in-memory login from 10-login-success is still alive — and
# self-heals via ensure-logged-in so it also passes standalone from a cold
# start. (The guard assumes the app is on the catalog, which both the cold
# start and the suite ordering guarantee.)
#
# Forms are longer than one screen on a phone profile and Maestro never
# scrolls on its own, hence the scrollUntilVisible steps before lower
# fields and buttons.
appId: com.saucelabs.mydemoapp.android
name: 20-checkout-journey
tags:
  - journey
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/ensure-logged-in.yaml
    env:
      USERNAME: bob@example.com
      PASSWORD: "10203040"
- runFlow: ../subflows/add-first-product-to-cart.yaml
# Header cart icon → cart review.
- tapOn:
    id: ".*:id/cartRL"
- assertVisible:
    text: "(?i)my cart"
- tapOn:
    id: ".*:id/cartBt"
# Shipping address (already logged in, so checkout goes straight here).
- assertVisible:
    id: ".*:id/fullNameET"
- tapOn:
    id: ".*:id/fullNameET"
- inputText: "Rebecca Winter"
- tapOn:
    id: ".*:id/address1ET"
- inputText: "Mandorley 112"
- scrollUntilVisible:
    element:
      id: ".*:id/cityET"
    direction: DOWN
- tapOn:
    id: ".*:id/cityET"
- inputText: "Truro"
# hideKeyboard is safe here and below: it always directly follows typing,
# so the soft keyboard is guaranteed up and BACK dismisses it (runs 2-3
# proved the IME appears in CI and hides the lower half of the form).
- hideKeyboard
- scrollUntilVisible:
    element:
      id: ".*:id/zipET"
    direction: DOWN
- tapOn:
    id: ".*:id/zipET"
- inputText: "89750"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: ".*:id/countryET"
    direction: DOWN
- tapOn:
    id: ".*:id/countryET"
- inputText: "United Kingdom"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: ".*:id/paymentBtn"
    direction: DOWN
- tapOn:
    id: ".*:id/paymentBtn"
# Payment details.
- assertVisible:
    id: ".*:id/cardNumberET"
- tapOn:
    id: ".*:id/nameET"
- inputText: "Rebecca Winter"
- tapOn:
    id: ".*:id/cardNumberET"
- inputText: "3258125675687891"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: ".*:id/expirationDateET"
    direction: DOWN
- tapOn:
    id: ".*:id/expirationDateET"
- inputText: "0330"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: ".*:id/securityCodeET"
    direction: DOWN
- tapOn:
    id: ".*:id/securityCodeET"
- inputText: "123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: ".*:id/paymentBtn"
    direction: DOWN
- tapOn:
    id: ".*:id/paymentBtn"
# Review order → place it.
- assertVisible:
    text: "(?i)review your order"
- tapOn:
    id: ".*:id/paymentBtn"
# Confirmation.
- assertVisible:
    text: "(?i)checkout complete"
- assertVisible:
    text: "(?i)thank you for your order.*"
# Back to shopping — leaves the app on the catalog, still logged in.
- tapOn:
    id: ".*:id/shoopingBt"
- assertVisible:
    id: ".*:id/productRV"
